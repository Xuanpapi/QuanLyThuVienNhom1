# Cloudflare chấm dứt HTTPS rồi nối vào nginx bằng HTTP, nên phải giữ lại
# X-Forwarded-Proto: https do Cloudflare gửi. Nếu truy cập trực tiếp trong LAN
# (không có header này) thì mới dùng $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # API: chuyển tiếp sang backend Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Gửi OTP qua SMTP có thể chờ tới 10s
        proxy_read_timeout 60s;
    }

    # Trang quản trị do backend sinh ra (kiểm tra phiên đăng nhập phía server)
    location /admin {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
