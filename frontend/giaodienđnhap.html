<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Thư viện trường X</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f2f5fa;
        }


        .login-box {

            width: 420px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.1);
        }


        .logo {

            text-align: center;

            font-size: 55px;

            margin-bottom: 10px;
        }


        h1 {

            text-align: center;

            color: #173b73;

            margin-bottom: 8px;

        }


        .description {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }


        .input-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            font-size: 14px;
        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 7px;

            outline: none;
        }


        input:focus {

            border-color: #173b73;
        }


        .forgot {

            text-align: right;

            margin-bottom: 20px;
        }


        .forgot a {

            color: #173b73;

            text-decoration: none;

            font-size: 13px;
        }


        button {

            width: 100%;

            padding: 13px;

            background: #173b73;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #2e5fa7;
        }


        .register {

            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #777;
        }


        .register a {

            color: #173b73;

            font-weight: bold;

            text-decoration: none;
        }


        .back {

            text-align: center;

            margin-top: 20px;
        }


        .back a {

            color: #777;

            font-size: 13px;

            text-decoration: none;
        }

    </style>

</head>


<body>


    <div class="login-box">


        <div class="logo">
            📚
        </div>


        <h1>
            Đăng nhập
        </h1>


        <p class="description">
            Đăng nhập vào hệ thống thư viện
        </p>


        


            

            <form action="giaodienchinh.html" method="GET">
    <div class="input-group">
<form>
                <label>
                    Email / Mã sinh viên
                </label>

                <input
                    type="text"
                    placeholder="Nhập email hoặc mã sinh viên"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Mật khẩu
                </label>

                <input
                    type="password"
                    placeholder="Nhập mật khẩu"
                    required
                >

            </div>


            <div class="forgot">

                <a href="#">
                    Quên mật khẩu?
                </a>

            </div>


            <button type="submit">
                 ĐĂNG NHẬP
            </button>
</form>


        </form>


        <div class="register">

            Chưa có tài khoản?

            <a href="giaodienđky.html">
                Đăng ký ngay
            </a>

        </div>


        <div class="back">

            <a href="qltv.html">
                ← Quay lại trang chủ
            </a>

        </div>


    </div>


</body>

</html>
