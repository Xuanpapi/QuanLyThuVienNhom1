spring.application.name=backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quan_ly_thu_vien}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:19062006}
spring.datasource.driver-class-name=org.postgresql.Driver

# Giữ nguyên tên bảng và tên cột như đã khai báo, không tự chèn dấu gạch dưới
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Cấu hình Gmail SMTP để gửi OTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:xuannv2006pt@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:csdfgglcsknkljvs}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Tránh treo request khi Gmail chậm/không phản hồi
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# OTP hết hạn sau 5 phút (đơn vị: milliseconds)
otp.expiry.ms=300000
# Thời gian chờ tối thiểu trước khi được gửi lại OTP đăng ký (60 giây)
otp.resend.cooldown.ms=60000
# Số lần gửi lại tối đa cho mỗi lượt đăng ký (1 lần → tổng cộng 2 mã)
otp.resend.max=1
# Số lần nhập sai OTP tối đa trước khi hủy mã
otp.max.fail=5
# Phiên đổi email 2 lớp OTP hết hạn sau 10 phút (đơn vị: milliseconds)
doi-email.pending.ttl.ms=600000

# URL trang đăng nhập frontend dùng khi phiên thủ thư hết hạn/chưa đăng nhập.
# Để dạng TƯƠNG ĐỐI để đổi domain tunnel (Cloudflare) không phải sửa cấu hình.
app.frontend.login-url=${APP_FRONTEND_LOGIN_URL:/giaodien\u0111nhap.html}

# Chạy sau reverse proxy (nginx/Cloudflare): đọc X-Forwarded-Proto, X-Forwarded-For
server.forward-headers-strategy=framework

# Giữ phiên đăng nhập lâu hơn cho nhóm test
server.servlet.session.timeout=8h
